<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/main-layout.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    window.addEventListener('error', function(e) {
      var msg = 'UNCAUGHT ERROR: ' + (e.error ? (e.error.stack || e.error.message) : e.message) + ' (' + e.filename + ':' + e.lineno + ')';
      console.error(msg);
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('cmd_log_webview', { level: 'error', msg: msg }).catch(function() {});
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e);
      var msg = 'UNHANDLED REJECTION: ' + reason;
      console.error(msg);
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('cmd_log_webview', { level: 'error', msg: msg }).catch(function() {});
      }
    });
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Clean Frameless macOS Window Titlebar -->
    <header class="app-titlebar" id="app-titlebar" data-tauri-drag-region>
      <!-- Swapped: Left side now holds meta and engine pill -->
      <div class="titlebar-meta" data-tauri-drag-region>
        <div class="engine-pill" id="engine-status-pill" title="Click to test sidecar connection">
          <span class="status-dot" id="engine-pill-dot"></span>
          <span id="engine-pill-text">Standby • Port 3000</span>
        </div>
        <span class="arch-tag">x86_64</span>
      </div>

      <!-- Center Title -->
      <div class="titlebar-nav" data-tauri-drag-region>
        <span class="brand-name">DeepSeek Harness</span>
        <span class="titlebar-sep">/</span>
        <span class="titlebar-scope" id="titlebar-scope">Workspace</span>
      </div>

      <!-- Swapped: Right side now holds minimize, maximize, and close -->
      <div class="traffic-lights">
        <button class="traffic-light minimize" id="tb-minimize" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 10 10" fill="currentColor">
            <path d="M1 5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="traffic-light expand" id="tb-expand" aria-label="Expand" title="Expand">
          <svg viewBox="0 0 10 10" fill="currentColor">
            <path d="M1.5 8.5L8.5 1.5M4 1.5h4.5v4.5M6 8.5H1.5V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="traffic-light close" id="tb-close" aria-label="Close" title="Close">
          <svg viewBox="0 0 10 10" fill="currentColor">
            <path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Stage -->
    <main class="app-stage">
      <!-- ── VIEW 1: PRISTINE AUTH SCREEN (Full ASCII Pond Canvas + Centered Mac-Style Card) ── -->
      <section class="auth-stage-view" id="auth-view" aria-label="Authentication">
        <!-- Fullscreen ASCII Pond Living Simulation Background -->
        <canvas id="pond-canvas" class="auth-bg-canvas"></canvas>

        <!-- Centered High-Contrast Glass Card -->
        <div class="auth-center-stage">
          <div class="auth-card" id="auth-card">
            <!-- Brand Lockup -->
            <div class="auth-card-brand">
              <div class="auth-whale-icon-wrap">
                <svg class="auth-whale-icon" viewBox="150 250 840 640" fill="currentColor" aria-hidden="true">

                </svg>
              </div>
              <div class="auth-brand-badge-lockup">
                <span class="auth-brand-name">deepseek</span>
                <span class="auth-badge-harness">HARNESS</span>
              </div>
              <p class="auth-card-subtitle">Welcome to DeepSeek Harness</p>
              <p class="auth-card-desc">Explore intelligence together.</p>
            </div>

            <!-- 1. Entry Options View (Official Mac Shell choices) -->
            <div class="auth-card-view active" id="auth-card-entry">
              <button type="button" class="btn-auth-primary" id="btn-signin-browser">
                <span class="btn-text-content">Sign In</span>
                <div class="spinner-minimal"></div>
              </button>
              <button type="button" class="btn-auth-secondary" id="btn-use-apikey">
                <span>Use API Key</span>
              </button>
            </div>

            <!-- 2. Waiting for Browser Authorization View -->
            <div class="auth-card-view" id="auth-card-waiting" style="display: none;">
              <div class="auth-waiting-badge">
                <div class="auth-pulsing-dot"></div>
                <span id="auth-waiting-title">Waiting for browser sign-in...</span>
              </div>
              <p class="auth-waiting-hint" id="auth-waiting-hint">Complete authorization in your browser tab to continue.</p>
              <div class="auth-view-actions">
                <button type="button" class="btn-auth-secondary" id="btn-copy-auth-link">Copy Sign-in Link</button>
                <button type="button" class="btn-auth-ghost" id="btn-cancel-auth">Cancel</button>
              </div>
            </div>

            <!-- 3. Direct API Key Input View -->
            <div class="auth-card-view" id="auth-card-apikey" style="display: none;">
              <div class="auth-key-header">
                <h3 class="auth-key-title">Enter DeepSeek API Key</h3>
                <p class="auth-key-hint">Stored securely in <code>~/.dsh/.credentials.yaml</code></p>
              </div>
              <div class="auth-input-wrapper">
                <input type="password" id="auth-apikey-input" class="auth-key-input" placeholder="sk-..." autocomplete="off" spellcheck="false" />
              </div>
              <div class="auth-view-actions">
                <button type="button" class="btn-auth-primary" id="btn-submit-apikey">
                  <span class="btn-text-content">Save and Continue</span>
                  <div class="spinner-minimal"></div>
                </button>
                <button type="button" class="btn-auth-ghost" id="btn-back-from-apikey">Back</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Global SVG Mask Definitions -->
      <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <defs>
          <mask id="dsh-whale-mask">
            <rect width="50" height="50" fill="white"/>
            <!-- Eye cutout dot -->
            <circle cx="27" cy="24.6" r="1.7" fill="black"/>
            <!-- Mouth curve cutout -->
            <path d="M26.2 22.2 C27.5 21.4 29.8 22.4 31.2 24 C32.3 25.2 32.8 26.4 32.7 27.4" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
          </mask>
        </defs>
      </svg>

      <!-- ── VIEW 2: FULL MAIN APPLICATION WORKSPACE ───────────────────────── -->
      <section class="main-app-stage hidden" id="main-app-stage" aria-label="DeepSeek Harness Workspace">
        <!-- Dynamically mounted: Sidebar + Chat Area -->
      </section>
    </main>
  </div>

  <script src="pond.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
