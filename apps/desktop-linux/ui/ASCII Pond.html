<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Pond</title>
<style>
:root{--bg:#fcfcfd;--mute:#98a1b2;--ink:#2a3140;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);overflow:hidden}
body{height:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:fixed;left:18px;top:calc(env(safe-area-inset-top,0px) + 14px);font-size:12px;color:var(--mute);pointer-events:none;letter-spacing:.02em}
.hud b{font-weight:500;color:var(--ink)}
.cur{display:inline-block;width:7px;height:13px;margin-left:3px;vertical-align:-2px;background:var(--ink);animation:blink 1.1s steps(1) infinite}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:11px;color:var(--mute);pointer-events:none}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b>~/pond</b> $ ./fish.sh<span class="cur"></span></div>
<div class="hint">click or tap the water</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BG='#fcfcfd',MONO='ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const wc=document.createElement('canvas'),wx=wc.getContext('2d');
const fc=document.createElement('canvas'),fx=fc.getContext('2d',{willReadFrequently:true});
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
const RAMP=' .:-=+*#%@';
const COLORS=[[236,108,38],[34,40,52],[214,62,52],[226,164,34],[64,98,150],[240,128,88],[40,40,44]];
const GL=['.',':','~','\u2248'];
const ST=['rgba(120,150,185,.30)','rgba(105,140,180,.38)','rgba(90,130,175,.48)','rgba(70,115,170,.58)'];
const N=14,SHX=11,SHY=16;
let W,H,dpr,cw,ch,cols,rows,fs,base,fish=[],ripples=[],last=0,wLast=0;

function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  cw=W<600?6:7;ch=W<600?10:12;fs=ch*.9;
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
  for(const c of [cv,wc]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}
  for(const c of [fc,sc]){c.width=cols;c.height=rows}
  base=Math.max(11,Math.min(20,W/75));
  const want=Math.round(Math.max(4,Math.min(9,W*H/150000)));
  while(fish.length<want)fish.push(mk(fish.length));
  fish.length=want;
  for(const f of fish){f.size=base*f.k;f.L=f.size*.7;f.spd=26+f.size*2.2}
  wLast=0;
}
function mk(i){
  const k=.75+Math.random()*.5,s=base*k,a=Math.random()*6.283;
  const x=W*(.15+Math.random()*.7),y=H*(.15+Math.random()*.7);
  const f={k,size:s,L:s*.7,spd:26+s*2.2,sp:0,a,x,y,seed:Math.random()*100,phase:Math.random()*6,wk:Math.random(),col:COLORS[i%COLORS.length],tgt:null,seg:[],P:[],T:[],M:[]};
  for(let j=0;j<N;j++)f.seg.push({x:x-Math.cos(a)*f.L*j,y:y-Math.sin(a)*f.L*j});
  return f;
}
const ang=d=>Math.atan2(Math.sin(d),Math.cos(d));

function update(f,dt,t){
  const turn=(Math.sin(t*.5+f.seed)+Math.sin(t*.83+f.seed*2.1)*.7)*.9;
  f.a+=turn*dt;
  let tsp=f.spd*(.75+.5*(.5+.5*Math.sin(t*.4+f.seed)));
  if(f.tgt){
    if(t>f.tgt.until||Math.hypot(f.tgt.x-f.x,f.tgt.y-f.y)<f.size*2)f.tgt=null;
    else{const d=ang(Math.atan2(f.tgt.y-f.y,f.tgt.x-f.x)-f.a);f.a+=Math.max(-2.2*dt,Math.min(2.2*dt,d));tsp*=1.5}
  }
  const m=90,push=Math.max(0,m-f.x,f.x-(W-m),m-f.y,f.y-(H-m))/m;
  if(push>0){const d=ang(Math.atan2(H/2-f.y,W/2-f.x)-f.a);f.a+=d*Math.min(1,push*1.5)*3*dt}
  f.sp+=(tsp-f.sp)*dt*1.5;
  f.x+=Math.cos(f.a)*f.sp*dt;f.y+=Math.sin(f.a)*f.sp*dt;
  f.x=Math.max(-30,Math.min(W+30,f.x));f.y=Math.max(-30,Math.min(H+30,f.y));
  f.phase+=dt*(3+f.sp*.07);
  const sg=f.seg;sg[0].x=f.x;sg[0].y=f.y;
  for(let i=1;i<N;i++){
    let dx=sg[i-1].x-sg[i].x,dy=sg[i-1].y-sg[i].y;const d=Math.hypot(dx,dy)||1;
    sg[i].x=sg[i-1].x-dx/d*f.L;sg[i].y=sg[i-1].y-dy/d*f.L;
  }
  const amp=f.size*(.28+.22*Math.min(1,f.sp/f.spd));
  for(let i=0;i<N;i++){
    const a=sg[Math.max(i-1,0)],b=sg[Math.min(i+1,N-1)];
    let tx=a.x-b.x,ty=a.y-b.y;const d=Math.hypot(tx,ty)||1;tx/=d;ty/=d;
    const nx=-ty,ny=tx,w=Math.sin(f.phase-i*.55)*amp*(.12+.88*i/(N-1));
    f.P[i]={x:sg[i].x+nx*w,y:sg[i].y+ny*w};f.T[i]={x:tx,y:ty};f.M[i]={x:nx,y:ny};
  }
  f.wk+=dt;
  if(f.wk>.5){f.wk=0;ripples.push({x:f.x,y:f.y,t,s:48,a:.3});if(ripples.length>16)ripples.shift()}
}

const rad=(s,t)=>s*Math.max(.35,Math.sin(Math.PI*(.1+.78*t))*(1-.5*t*t));

function drawFish(g,f,ox,oy,shadow){
  const P=f.P,s=f.size,[R,G,B]=f.col;
  const col=a=>shadow?`rgba(0,0,0,${a*.5})`:`rgba(${R},${G},${B},${a})`;
  // fins + tail
  g.beginPath();
  const e=P[N-1],d={x:-f.T[N-1].x,y:-f.T[N-1].y},n=f.M[N-1];
  const sw=Math.sin(f.phase-N*.55)*s*.9,len=s*2.4;
  const ex=e.x+ox,ey=e.y+oy;
  g.moveTo(ex,ey);
  g.lineTo(ex+d.x*len+n.x*(s+sw),ey+d.y*len+n.y*(s+sw));
  g.lineTo(ex+d.x*len*.7+n.x*sw*.6,ey+d.y*len*.7+n.y*sw*.6);
  g.lineTo(ex+d.x*len+n.x*(-s+sw),ey+d.y*len+n.y*(-s+sw));
  g.closePath();
  for(const [idx,sz] of [[3,.9],[8,.55]]){
    const p=P[idx],T=f.T[idx],M=f.M[idx],r=rad(s,idx/(N-1));
    for(const sg of [-1,1]){
      const cx=p.x+ox+M.x*sg*(r+s*.4*sz)-T.x*s*.2,cy=p.y+oy+M.y*sg*(r+s*.4*sz)-T.y*s*.2;
      const rot=Math.atan2(T.y,T.x)+sg*(.7+.25*Math.sin(f.phase*.7+sg)),rx=s*sz,ry=s*.3*sz;
      g.moveTo(cx+Math.cos(rot)*rx,cy+Math.sin(rot)*rx);
      g.ellipse(cx,cy,rx,ry,rot,0,6.2832);
    }
  }
  g.fillStyle=col(.4);g.fill();
  // body
  g.beginPath();
  const pts=[];
  for(let i=0;i<N-1;i++)for(let k=0;k<3;k++){
    const u=k/3,t=(i+u)/(N-1),x=P[i].x+(P[i+1].x-P[i].x)*u+ox,y=P[i].y+(P[i+1].y-P[i].y)*u+oy,r=rad(s,t);
    pts.push([x,y,r,t]);g.moveTo(x+r,y);g.arc(x,y,r,0,6.2832);
  }
  g.fillStyle=col(.62);g.fill();
  if(shadow)return;
  // darker back stripe + spots
  g.beginPath();
  for(const [x,y,r,t] of pts){if(t>.08&&t<.88){g.moveTo(x+r*.45,y);g.arc(x,y,r*.45,0,6.2832)}}
  g.fillStyle=col(.4);g.fill();
  g.beginPath();
  for(const i of [4,9]){const p=P[i],r=rad(s,i/(N-1))*.75;g.moveTo(p.x+r,p.y);g.arc(p.x,p.y,r,0,6.2832)}
  g.fillStyle=col(.25);g.fill();
}

function drawWater(t){
  wx.setTransform(dpr,0,0,dpr,0,0);
  wx.fillStyle=BG;wx.fillRect(0,0,W,H);
  wx.font=fs+'px '+MONO;wx.textAlign='center';wx.textBaseline='middle';
  ripples=ripples.filter(r=>t-r.t<3.2);
  const lv=[[],[],[],[]];
  for(let r=0;r<rows;r++){
    const y=(r+.5)*ch;
    for(let c=0;c<cols;c++){
      const x=(c+.5)*cw;
      let v=(Math.sin(x*.021+t*.55+Math.sin(y*.017+t*.3)*2.2)+Math.sin(y*.026-t*.42+Math.sin(x*.012-t*.2)*1.8)+Math.sin((x+y)*.013+t*.35))/3;
      v=.5+.5*v;
      for(let i=0;i<ripples.length;i++){
        const q=ripples[i],age=t-q.t,k=(Math.hypot(x-q.x,y-q.y)-age*q.s)/16;
        if(k>-3&&k<3)v+=q.a*Math.exp(-k*k)*(1-age/3.2)*.55;
      }
      const l=v>.9?3:v>.8?2:v>.7?1:v>.6?0:-1;
      if(l>=0)lv[l].push(x,y+1);
    }
  }
  for(let l=0;l<4;l++){
    wx.fillStyle=ST[l];const a=lv[l],g=GL[l];
    for(let i=0;i<a.length;i+=2)wx.fillText(g,a[i],a[i+1]);
  }
}

function blit(g,shadow){
  const d=g.getImageData(0,0,cols,rows).data;
  for(let i=0;i<d.length;i+=4){
    const a=d[i+3];if(a<26)continue;
    const p=i>>2,c=p%cols,r=(p/cols)|0;
    ctx.fillStyle=BG;ctx.fillRect(c*cw,r*ch,cw,ch);
    ctx.fillStyle=shadow?'rgb(165,174,190)':'rgb('+d[i]+','+d[i+1]+','+d[i+2]+')';
    ctx.fillText(RAMP[Math.min(9,(a/255*10)|0)],(c+.5)*cw,(r+.5)*ch+1);
  }
}

function frame(ts){
  const t=ts/1000,dt=Math.min(.05,t-last||.016);last=t;
  for(const f of fish)update(f,dt,t);
  if(t-wLast>.032){drawWater(t);wLast=t}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(wc,0,0,W,H);
  ctx.font=fs+'px '+MONO;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const g of [fx,sx]){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cols,rows);g.setTransform(1/cw,0,0,1/ch,0,0)}
  for(const f of fish){drawFish(sx,f,SHX,SHY,true)}
  for(const f of fish){drawFish(fx,f,0,0,false)}
  blit(sx,true);blit(fx,false);
  requestAnimationFrame(frame);
}

function poke(e){
  const now=performance.now()/1000;
  ripples.push({x:e.clientX,y:e.clientY,t:now,s:85,a:1});
  ripples.push({x:e.clientX,y:e.clientY,t:now+.28,s:70,a:.7});
  if(ripples.length>16)ripples.splice(0,ripples.length-16);
  for(const f of fish)if(Math.hypot(f.x-e.clientX,f.y-e.clientY)<460)f.tgt={x:e.clientX,y:e.clientY,until:now+5};
}
addEventListener('pointerdown',poke);
addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
